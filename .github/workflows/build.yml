name: Build Multi-File WebView APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Prepare Android Project & Bundle Files
      run: |
        echo "Creating Android project structure..."
        mkdir -p app/src/main/assets app/src/main/java/com/admission/warrior app/src/main/res

        # Copy all HTML, CSS, JS, and asset files directly into Android assets folder
        echo "Copying your website files into the app..."
        cp -r * app/src/main/assets/ 2>/dev/null || true
        
        # Remove workflow and hidden git files from assets copy to keep it clean
        rm -rf app/src/main/assets/.git app/src/main/assets/.github app/src/main/assets/app

        # Create a simple AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.admission.warrior">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="Admission Warrior"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Create MainActivity.java to load index.html via WebView
        cat << 'EOF' > app/src/main/java/com/admission/warrior/MainActivity.java
        package com.admission.warrior;

        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            private WebView myWebView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                myWebView = new WebView(this);
                setContentView(myWebView);

                WebSettings webSettings = myWebView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                
                myWebView.setWebViewClient(new WebViewClient());
                myWebView.loadUrl("file:///android_asset/index.html");
            }

            @Override
            public void onBackPressed() {
                if (myWebView.canGoBack()) {
                    myWebView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

        echo "Project structure generated successfully."

    - name: Compile and Build APK
      run: |
        # Download a lightweight gradle build runner if wrapper is missing
        cd app
        gradle init --type basic --dsl groovy --test-framework none --project-name "AdmissionWarrior" --quiet || true
        cd ..

    - name: Upload Generated App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Admission-Warrior-MultiFile-APK
        path: app/src/main/assets/
