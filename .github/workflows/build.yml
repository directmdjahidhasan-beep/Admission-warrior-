name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download and Setup Android SDK & Build Tools
      uses: android-actions/setup-android@v2

    - name: Build Debug APK using Gradle
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        gradle build -Dorg.gradle.java.home="${JAVA_HOME}" || {
          # Fallback if global gradle is missing, download a quick gradle wrapper
          npx gradle-to-node || true
          curl -s https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar -o gradle-wrapper.jar
          mvn -version || true
          ./gradlew assembleDebug || gradle assembleDebug
        }
